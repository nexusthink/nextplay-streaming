# ==============================================================================
# NEXTPLAY STREAMING - CONFIGURAÇÃO NGINX DE PRODUÇÃO (SPA + ADMIN + APK + STREAM)
# ==============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Compressão Gzip de Alta Velocidade
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck para Docker / Reverse Proxy
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Atalho curto /apk e /download/nextplay.apk para download direto do APK Android / TV Box
    location = /apk {
        alias /usr/share/nginx/html/download/nextplay.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="NextPlay-Universal-Mobile-TV.apk"' always;
        add_header Cache-Control "no-cache";
    }

    location = /download/nextplay.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="NextPlay-Universal-Mobile-TV.apk"' always;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy Reverso Interno para a API Express do NextPlay (127.0.0.1:4150 no mesmo container)
    location /api/ {
        proxy_pass http://127.0.0.1:4150/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Cache longo para assets compilados pelo Vite
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA (Player principal em / e Painel Administrativo em /admin)
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

